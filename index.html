<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/assets/icon-amber-round.svg" />
<title>KBridge</title>
<meta name="description" content="Partner portal connecting capital partners and receivables platforms with interactive token minting, redemptions, and NAV tracking." />
<meta property="og:title" content="KBridge" />
<meta property="og:description" content="Partner portal connecting capital partners and receivables platforms with interactive token minting, redemptions, and NAV tracking." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F4; --card:#FFFFFF; --line:#E4E4E0; --line-soft:#F0F0EC;
  --ink:#141413; --ink-2:#3B3B38; --muted:#6B6B66; --faint:#9A9A94;
  --black:#141413;
  /* status only — never decoration */
  --ok:#15803D; --ok-bg:#F0FDF4; --ok-line:#BBF7D0;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#FCD9A5;
  --bad:#B42318; --bad-bg:#FEF3F2; --bad-line:#FECDCA;
  --neutral-bg:#F3F3F0; --neutral-line:#E4E4E0;
  --theoriq:#141413; --pursuit:#57534E;
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.08),0 1px 2px -1px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --r-sm:6px; --r:8px; --r-lg:12px; --r-xl:16px;
  --ease-spring:cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce:cubic-bezier(0.34, 1.56, 0.64, 1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-variant-ligatures:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D6D6D1;border-radius:8px;border:3px solid var(--bg);transition:background 0.2s ease}
::-webkit-scrollbar-thumb:hover{background:#B5B5AF}
::-webkit-scrollbar-track{background:transparent}

/* ---------- primitives ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.wrap{padding:0 24px}}
@media(min-width:1024px){.wrap{padding:0 32px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);
  transition:box-shadow .2s var(--ease-spring),border-color .2s var(--ease-spring),transform .2s var(--ease-spring)}
.card-pad{padding:24px}
.card-head{padding:18px 24px;border-bottom:1px solid var(--line);background:#FAFAF8;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:var(--r-lg) var(--r-lg) 0 0}
.card-head h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.micro{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.grid{display:grid;gap:20px}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.gap16{gap:16px}
.stack{display:flex;flex-direction:column;min-width:0}
.hide{display:none !important}
.sep{height:1px;background:var(--line);margin:16px 0}

/* ---------- responsive buttons with micro-animations ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r);
  font-size:13.5px;font-weight:500;
  transition:background .18s var(--ease-spring),border-color .18s var(--ease-spring),color .18s var(--ease-spring),box-shadow .18s var(--ease-spring),transform .14s var(--ease-spring),opacity .18s ease;
  white-space:nowrap;user-select:none;position:relative}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(0.97)}
.btn-primary{background:var(--black);color:#fff;box-shadow:var(--shadow-xs)}
.btn-primary:hover{background:#1F2937;box-shadow:0 3px 8px -1px rgba(0,0,0,.18),0 2px 4px -2px rgba(0,0,0,.12)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink-2);box-shadow:var(--shadow-xs)}
.btn-ghost:hover{border-color:var(--faint);color:var(--ink);box-shadow:0 2px 5px 0 rgba(0,0,0,.06)}
.btn-quiet{color:var(--muted);padding:8px 10px}
.btn-quiet:hover{color:var(--ink);background:var(--line-soft);transform:none}
.btn-quiet:active{transform:scale(0.96)}
.btn-danger{border:1px solid var(--bad-line);background:#fff;color:var(--bad)}
.btn-danger:hover{background:var(--bad-bg);box-shadow:0 2px 6px 0 rgba(180,35,24,.08)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;box-shadow:none !important}
.btn-block{width:100%}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid transparent;transition:all .18s ease}
.badge .dot{width:6px;height:6px;border-radius:999px;display:block;transition:transform .2s ease}
.b-ink{background:var(--ink);color:#fff;border-color:var(--ink)}.b-ink .dot{background:#fff}
.b-green{background:var(--ok-bg);color:#14532D;border-color:var(--ok-line)}.b-green .dot{background:var(--ok);animation:dotPulse 2s infinite}
.b-amber{background:var(--warn-bg);color:#7C2D12;border-color:var(--warn-line)}.b-amber .dot{background:#D97706;animation:dotPulse 2s infinite}
.b-gray{background:var(--neutral-bg);color:var(--ink-2);border-color:var(--line)}.b-gray .dot{background:var(--faint)}
.b-red{background:var(--bad-bg);color:#7F1D1D;border-color:var(--bad-line)}.b-red .dot{background:var(--bad);animation:dotPulse 1.6s infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.75}}

.field{display:block}
.field > span:first-child{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}

/* ---------- custom select with dropdown animations ---------- */
.sel{position:relative}
.sel-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;
  border:1px solid #D6D6D1;border-radius:var(--r);background:#fff;box-shadow:var(--shadow-xs);text-align:left;
  transition:border-color .16s ease,box-shadow .16s ease,transform .12s ease}
.sel-btn:hover{border-color:var(--faint)}
.sel-btn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sel-btn .icon{color:var(--faint);transition:transform .2s var(--ease-spring)}
.sel-btn.on .icon{transform:rotate(180deg)}
.sel-lab{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-sub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-menu{position:absolute;left:0;right:0;z-index:100;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:5px;max-height:250px;overflow-y:auto;
  animation:dropdownSlide .18s var(--ease-spring);transform-origin:top center}
@keyframes dropdownSlide{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.sel-opt{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:var(--r);text-align:left;
  transition:background .14s ease,transform .1s ease}
.sel-opt:hover{background:var(--neutral-bg)}
.sel-opt:active{transform:scale(0.98)}
.sel-opt.sel-on{background:var(--neutral-bg)}
.sel-tick{opacity:0;color:var(--ink);display:flex;transition:transform .15s var(--ease-spring),opacity .15s ease}
.sel-opt.sel-on .sel-tick{opacity:1;animation:checkPop .2s var(--ease-spring)}

.numdot{width:22px;height:22px;border-radius:999px;background:var(--neutral-bg);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.wic{width:34px;height:34px;border-radius:9px;background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;flex:none;transition:transform .2s var(--ease-spring)}
.wrow:hover .wic{transform:scale(1.08)}
.neg{color:var(--bad)}
.gate-role{background:var(--neutral-bg);color:var(--ink-2);border:1px solid var(--line);transition:background .18s,border-color .18s}
.input{display:block;width:100%;padding:9px 12px;border:1px solid #D6D6D1;border-radius:var(--r);background:#fff;
  box-shadow:var(--shadow-xs);outline:none;transition:border-color .18s ease,box-shadow .18s ease,transform .12s ease}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:var(--black);box-shadow:0 0 0 1.5px var(--black),var(--shadow-xs)}
.input.mono{letter-spacing:-.01em}
.input-lg{padding:12px 14px;font-size:18px;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.err{font-size:12px;color:var(--bad);margin-top:6px;display:flex;align-items:center;gap:6px;animation:fadein .2s ease}

table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  text-align:left;padding:10px 20px;background:#FAFAF8;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:14px 20px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.hover-row{transition:background-color .15s ease}
tbody tr.hover-row:hover{background:#FAFAF8}
.t-right{text-align:right}
.table-scroll{overflow-x:auto}

.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.icon-sm{width:14px;height:14px}
.icon-lg{width:20px;height:20px}

/* ---------- logos ---------- */
.klogo{display:inline-flex;align-items:center;justify-content:center;user-select:none;transition:transform .2s var(--ease-spring)}
.brandline:hover .klogo{transform:scale(1.05)}
.brandline{display:flex;align-items:center;gap:10px}
.brandline .name{font-size:19px;font-weight:500;letter-spacing:-.02em}
.brand-word{width:auto;display:block;object-fit:contain}
.brand-mark{display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.org-name{display:flex;align-items:center}
.org-mark-only{display:none}

/* ---------- gate / login with enhanced card hover ---------- */
.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 16px}
.gate-grid{display:grid;grid-template-columns:1fr;gap:20px;width:100%;max-width:1100px;margin-top:32px}
@media(min-width:640px) and (max-width:959px){.gate-grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.gate-grid{grid-template-columns:repeat(3, 1fr)}}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;text-align:left;
  box-shadow:var(--shadow-xs);transition:border-color .22s var(--ease-spring),box-shadow .22s var(--ease-spring),transform .22s var(--ease-spring);
  position:relative;overflow:hidden;cursor:pointer}
.gate-card:hover{border-color:var(--ink);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.gate-card:active{transform:translateY(-1px) scale(0.995)}
.gate-card:hover .gate-role{background:var(--ink);color:#fff;border-color:var(--ink)}
.gate-role{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.partner-pill{display:inline-flex;align-items:center;justify-content:center;padding:8px 18px;border-radius:999px;
  background:#F5F5F2;border:1px solid var(--line);font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
  box-shadow:var(--shadow-xs);transition:all .2s var(--ease-spring);white-space:nowrap}
.gate-card:hover .partner-pill{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.gate-arrow{width:28px;height:28px;border-radius:999px;background:#FAFAF8;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);transition:all .2s var(--ease-spring)}
.gate-card:hover .gate-arrow{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateX(2px)}
.login-card{width:100%;max-width:440px}

/* ---------- top right admin pill button ---------- */
.top-right-admin-bar{position:fixed;top:20px;right:24px;display:flex;align-items:center;gap:8px;z-index:50}
.kbridge-admin-pill{display:inline-flex;align-items:center;gap:10px;background:#141413;color:#fff;padding:8px 10px 8px 18px;border-radius:999px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:all .2s var(--ease-spring);cursor:pointer;border:1px solid #141413;user-select:none;white-space:nowrap}
.kbridge-admin-pill:hover{background:#262624;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(-1px)}
.kbridge-admin-pill:active{transform:translateY(1px) scale(0.98)}
.kbridge-admin-pill.on-active{background:#0F172A;border-color:#334155}
.pill-circle-arrow{width:26px;height:26px;border-radius:999px;background:#262624;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s var(--ease-spring),background .2s;flex:none}
.kbridge-admin-pill:hover .pill-circle-arrow{background:#3B3B38;transform:translateX(2px)}
.eye-toggle-btn{padding:7px 9px;border-radius:999px;color:var(--muted);background:rgba(255,255,255,.85);border:1px solid var(--line);box-shadow:var(--shadow-xs);transition:all .18s var(--ease-spring);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.eye-toggle-btn:hover{color:var(--ink);background:#fff;border-color:var(--faint);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.eye-toggle-btn:active{transform:scale(0.95)}
.login-top{height:4px;border-radius:var(--r-xl) var(--r-xl) 0 0}
.cobrand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px}
.cobrand .x{width:1px;height:26px;background:var(--line)}

/* ---------- header ---------- */
header.app{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);transition:box-shadow .2s ease}
.hbar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.nav{display:none;gap:2px;margin-left:22px}
@media(min-width:900px){.nav{display:flex}}
.nav button{padding:8px 12px;font-size:13.5px;font-weight:500;color:var(--muted);border-radius:var(--r);
  transition:all .18s var(--ease-spring);white-space:nowrap;position:relative}
.nav button:hover{color:var(--ink);background:rgba(0,0,0,.03)}
.nav button.on{background:var(--neutral-bg);color:var(--ink)}
.nav button:active{transform:scale(0.96)}
.wallet-chip{display:flex;align-items:center;gap:10px;background:#FAFAF8;border:1px solid var(--line);border-radius:var(--r);
  padding:5px 10px;box-shadow:var(--shadow-xs);transition:all .18s var(--ease-spring);cursor:pointer}
.wallet-chip:hover{background:var(--neutral-bg);border-color:#D6D6D1;transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.wallet-chip:active{transform:translateY(0) scale(0.98)}
.avatar{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.divider-v{width:1px;height:22px;background:var(--line)}
.bell{position:relative;padding:8px;color:var(--faint);border-radius:var(--r);transition:color .16s,background .16s,transform .16s}
.bell:hover{color:var(--ink);background:var(--line-soft)}
.bell:hover .icon{animation:bellJingle .6s var(--ease-spring) both}
@keyframes bellJingle{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.bell .pip{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:999px;background:var(--bad);border:1.5px solid #fff;
  animation:pipPulse 2.4s infinite}
@keyframes pipPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(180,35,24,.6)}50%{transform:scale(1.15);box-shadow:0 0 0 4px rgba(180,35,24,0)}}

@media(max-width:820px){
  .hide-sm,.org-badge,.chip-addr,.chip-div{display:none}
  .hbar{gap:8px}
  .brandline .name{font-size:16px;padding-right:10px !important}
  .wallet-chip{padding:5px 8px}
  .page-head h1{font-size:20px}
  .stat .value{font-size:24px}
  .card-pad{padding:18px}
  .modal-body{padding:18px;gap:15px}
}
@media(max-width:580px){
  .org-name,.brandline .name,.range-tabs{display:none}
  .org-mark-only{display:flex}
  .brandline{gap:0}
  .hbar,.hbar > div{min-width:0}
  .stats{gap:14px}
  .cols{gap:14px}
  main{padding:20px 0 60px}
}
.mobile-nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 10px}
@media(min-width:900px){.mobile-nav{display:none}}
.mobile-nav button{padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:#fff;
  transition:all .18s var(--ease-spring)}
.mobile-nav button:hover{border-color:var(--faint);color:var(--ink)}
.mobile-nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mobile-nav button:active{transform:scale(0.95)}

/* ---------- page ---------- */
main{padding:28px 0 72px}
.page-head{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:600;letter-spacing:-.02em}
.page-head p{font-size:13.5px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-bottom:24px}
.stat{transition:transform .2s var(--ease-spring),box-shadow .2s var(--ease-spring),border-color .2s var(--ease-spring)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:#D6D6D1}
.stat .label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:14px}
.stat .value{font-size:28px;font-weight:500;letter-spacing:-.02em}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.pos{color:var(--ok)}
.cols{display:grid;gap:20px;grid-template-columns:1fr;align-items:start}
.cols > *{min-width:0}
.grid > *{min-width:0}
.card{min-width:0}
@media(min-width:1024px){.cols-2-1{grid-template-columns:2fr 1fr}.cols-1-1{grid-template-columns:1fr 1fr}}

/* hero */
.hero{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-xs)}
.hero:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--theoriq),var(--pursuit))}

/* chart */
.chart-wrap{position:relative}
.chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 10px;font-size:11.5px;
  box-shadow:var(--shadow-lg);transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .15s ease,transform .15s ease}
.chart-tip.on{opacity:1;transform:translate(-50%,-120%)}
.range-tabs{display:flex;gap:2px;padding:3px;background:var(--neutral-bg);border-radius:var(--r);border:1px solid var(--line)}
.range-tabs button{padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:5px;transition:all .16s var(--ease-spring)}
.range-tabs button:hover{color:var(--ink)}
.range-tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.range-tabs button:active{transform:scale(0.95)}

/* feed */
.feed-item{display:flex;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line-soft);transition:background-color .15s ease}
.feed-item:hover{background:#FAFAF8}
.feed-item:last-child{border-bottom:none}
.feed-ic{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
  transition:transform .2s var(--ease-spring)}
.feed-item:hover .feed-ic{transform:scale(1.1)}
.feed-item p{font-size:13px;color:var(--ink-2)}
.feed-item .when{font-size:11px;color:var(--faint);margin-top:3px}

/* wallet rows */
.wrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-soft);
  transition:background-color .15s ease,transform .15s var(--ease-spring)}
.wrow:last-child{border-bottom:none}
button.wrow{cursor:pointer}
button.wrow:hover{background:#FAFAF8}
button.wrow:active{transform:scale(0.995);background:var(--neutral-bg)}
.wrow .addr{font-size:12px;color:var(--muted);margin-top:3px}
.locked{background:#FAFAF8}

/* ---------- modal & overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.52);backdrop-filter:blur(4px);animation:fadeOverlay .2s var(--ease-spring)}
@keyframes fadeOverlay{from{opacity:0;backdrop-filter:blur(0px)}to{opacity:1;backdrop-filter:blur(4px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal{width:100%;max-width:520px;background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow-xl);border:1px solid var(--line-soft);
  display:flex;flex-direction:column;max-height:92vh;overflow:hidden;animation:modalPop .24s var(--ease-spring)}
@keyframes modalPop{0%{opacity:0;transform:translateY(18px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.modal-wide{max-width:640px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);background:rgba(246,246,244,.7);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-head h2{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-head p{font-size:12px;color:var(--muted);margin-top:3px}
.modal-body{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line-soft);background:#FAFAF8;display:flex;gap:10px;justify-content:flex-end}
.xbtn{padding:6px;border-radius:999px;color:var(--faint);transition:all .15s ease}
.xbtn:hover{color:var(--ink-2);background:var(--line-soft);transform:scale(1.08)}
.xbtn:active{transform:scale(0.92)}

.panel{background:#FAFAF8;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;transition:border-color .18s ease}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500}
.kv-total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-size:14.5px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;gap:6px;padding:4px;background:var(--neutral-bg);border-radius:var(--r-lg);border:1px solid var(--line)}
.seg button{padding:9px 12px;border-radius:var(--r);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .18s var(--ease-spring)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs);border:1px solid var(--line)}
.seg button:active{transform:scale(0.96)}

/* steps */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid transparent;
  transition:background-color .25s var(--ease-spring),border-color .25s var(--ease-spring),transform .2s ease}
.step.active{background:var(--neutral-bg);border-color:var(--line);transform:translateX(3px)}
.step.done{background:#fff}
.step .sic{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--neutral-bg);color:var(--faint);border:1px solid var(--line);transition:all .25s var(--ease-spring)}
.step.active .sic{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.08)}
.step.done .sic{background:var(--ok);color:#fff;border-color:var(--ok);animation:checkPop .3s var(--ease-spring)}
@keyframes checkPop{0%{transform:scale(0.6)}65%{transform:scale(1.22)}100%{transform:scale(1)}}
.step .txt{font-size:13px;font-weight:500;color:var(--faint);transition:color .2s}
.step.active .txt,.step.done .txt{color:var(--ink)}
.step .meta{font-size:11px;color:var(--muted);margin-top:2px;font-weight:400}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.hashbox{font-size:11.5px;background:#F9FAFB;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  word-break:break-all;color:var(--muted)}

/* success burst */
.tick{width:56px;height:56px;border-radius:999px;background:var(--ok-bg);border:1px solid var(--ok-line);
  display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--ok);
  animation:tickBurst .4s var(--ease-spring)}
@keyframes tickBurst{0%{transform:scale(0.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}

/* ---------- toast notifications with slide & scale in ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{display:flex;align-items:flex-start;gap:12px;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:12px 16px;
  box-shadow:0 12px 30px -4px rgba(0,0,0,.25),0 4px 10px -2px rgba(0,0,0,.15);font-size:13px;width:380px;max-width:100%;
  animation:toastIn .28s var(--ease-spring);transition:transform .24s var(--ease-spring),opacity .24s ease;pointer-events:auto;
  border:1px solid rgba(255,255,255,0.12);position:relative;overflow:hidden}
.toast-success{background:#111827;border-left:4px solid #10B981}
.toast-error{background:#181111;border-left:4px solid #EF4444;border-color:rgba(239,68,68,0.3)}
.toast-error .t-sub{color:#FCA5A5}
.toast-warn{background:#1C1917;border-left:4px solid #F59E0B;border-color:rgba(245,158,11,0.3)}
.toast-warn .t-sub{color:#FDE68A}
.toast-info{background:#111827;border-left:4px solid #38BDF8}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast-out{opacity:0 !important;transform:translateY(12px) scale(0.94) !important}
.toast .t-ic{flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.toast .t-content{flex:1;min-width:0}
.toast .t-title{font-weight:600;line-height:1.4;letter-spacing:-.01em}
.toast .t-sub{font-size:12px;color:#A3A39D;margin-top:2px;line-height:1.4;word-break:break-word}
.toast .t-close{background:none;border:none;color:#9CA3AF;padding:2px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:color .15s ease,background .15s ease;margin:-2px -4px 0 0}
.toast .t-close:hover{color:#fff;background:rgba(255,255,255,0.15)}

.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-lg);font-size:12.5px;line-height:1.5;transition:all .2s ease}
.c-neutral{background:var(--neutral-bg);border:1px solid var(--line);color:var(--ink-2)}
.c-amber{background:var(--warn-bg);border:1px solid var(--warn-line);color:#7C2D12}
.c-red{background:var(--bad-bg);border:1px solid var(--bad-line);color:#7F1D1D}
.c-gray{background:#FAFAF8;border:1px solid var(--line);color:var(--ink-2)}

.slider{-webkit-appearance:none;width:100%;height:5px;border-radius:999px;background:var(--line);outline:none;margin:14px 0 4px;transition:background .2s ease}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:999px;background:#fff;border:2px solid var(--ink);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s var(--ease-spring),box-shadow .15s ease,background-color .15s ease}
.slider::-webkit-slider-thumb:hover{transform:scale(1.22);box-shadow:0 2px 6px rgba(0,0,0,.18);background:#FAFAF8}
.slider::-webkit-slider-thumb:active{transform:scale(1.05);background:var(--ink)}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:999px;background:#fff;border:2px solid var(--ink);cursor:pointer;transition:transform .15s var(--ease-spring)}
.slider::-moz-range-thumb:hover{transform:scale(1.22)}

.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{padding:4px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;
  transition:all .15s var(--ease-spring)}
.presets button:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-xs)}
.presets button:active{transform:scale(0.95)}

.progress{height:6px;border-radius:999px;background:var(--neutral-bg);overflow:hidden}
.progress > div{height:100%;border-radius:999px;background:linear-gradient(90deg,#3B3B38 0%,var(--ink) 100%);transition:width .45s var(--ease-spring)}

/* ---------- page view transitions with stagger ---------- */
.fadein{animation:fadein .28s var(--ease-spring)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Staggered entrance for stats and cards */
.stats > .stat:nth-child(1){animation:fadein .25s var(--ease-spring) 0.03s both}
.stats > .stat:nth-child(2){animation:fadein .25s var(--ease-spring) 0.06s both}
.stats > .stat:nth-child(3){animation:fadein .25s var(--ease-spring) 0.09s both}
.stats > .stat:nth-child(4){animation:fadein .25s var(--ease-spring) 0.12s both}
.gate-grid > .gate-card:nth-child(1){animation:fadein .3s var(--ease-spring) 0.04s both}
.gate-grid > .gate-card:nth-child(2){animation:fadein .3s var(--ease-spring) 0.1s both}
.gate-grid > .gate-card:nth-child(3){animation:fadein .3s var(--ease-spring) 0.16s both}

/* ---------- upload & contract documents ---------- */
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:24px 16px;text-align:center;background:#FAFAF8;
  transition:border-color .18s ease,background-color .18s ease;cursor:pointer}
.dropzone:hover,.dropzone.dragover{border-color:var(--ink);background:#F3F3F0}
.doc-chip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);font-size:13px;box-shadow:var(--shadow-xs);transition:border-color .15s ease}
.doc-chip:hover{border-color:var(--ink-3)}
.doc-chip .d-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.doc-chip .d-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-chip .d-size{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-chip .d-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.doc-eye-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:500;
  border:1px solid var(--line);background:#FAFAFA;color:var(--ink);cursor:pointer;transition:all .18s var(--ease-spring)}
.doc-eye-btn:hover{background:#0F172A;color:#fff;border-color:#0F172A;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,0.12)}
.doc-eye-btn svg{color:inherit}

/* pipeline stages */
.pipe-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
@media(max-width:700px){.pipe-steps{grid-template-columns:1fr 1fr}}
.pipe-step{padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-size:12px}
.pipe-step.active{border-color:var(--ink);background:var(--neutral-bg);font-weight:600}
.pipe-step.done{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.pipe-step .num{font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pipe-step.done .num{color:var(--ok)}
.admin-badge-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--ink);transition:all .18s var(--ease-spring)}
.admin-badge-btn:hover{border-color:var(--ink);background:var(--neutral-bg);transform:translateY(-1px)}

/* ---------- auth & signup / password reset styles ---------- */
.auth-wrap{width:100%;max-width:540px;margin:0 auto}
.auth-wrap-wide{max-width:620px}
.role-choice-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));gap:12px;margin-bottom:20px}
@media(max-width:540px){.role-choice-grid{grid-template-columns:1fr}}
.role-choice-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:var(--r-lg);
  border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:all .18s var(--ease-spring);position:relative}
.role-choice-btn:hover{border-color:var(--ink-2);background:#FAFAF8;transform:translateY(-1px)}
.role-choice-btn.selected{border-color:var(--ink);background:var(--neutral-bg);box-shadow:0 0 0 1px var(--ink)}
.role-choice-btn .role-tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;margin-bottom:8px}
.role-choice-btn .role-title{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.role-choice-btn .role-desc{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.two-col{grid-template-columns:1fr}}

/* password strength meter */
.pw-strength-bar{display:flex;gap:4px;height:4px;margin-top:6px;border-radius:999px;overflow:hidden}
.pw-strength-segment{flex:1;height:100%;background:var(--line);border-radius:999px;transition:background .2s ease}
.pw-strength-segment.active-weak{background:var(--bad)}
.pw-strength-segment.active-fair{background:var(--warn)}
.pw-strength-segment.active-good{background:#2563EB}
.pw-strength-segment.active-strong{background:var(--ok)}
.pw-checklist{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
@media(max-width:480px){.pw-checklist{grid-template-columns:1fr}}
.pw-req-item{display:flex;align-items:center;gap:6px;transition:color .16s ease}
.pw-req-item.met{color:var(--ok);font-weight:500}
.pw-req-item.met svg{color:var(--ok)}

/* verification code inputs */
.code-box-wrap{display:flex;gap:8px;justify-content:center;margin:16px 0}
.code-input-lg{width:100%;max-width:280px;text-align:center;letter-spacing:10px;font-size:26px;font-weight:600;
  padding:12px;border:1.5px solid #D6D6D1;border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow-xs);outline:none;
  transition:border-color .18s,box-shadow .18s}
.code-input-lg:focus{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

/* progress stepper for password reset */
.auth-stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.auth-step-dot{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--faint)}
.auth-step-dot.active{color:var(--ink);font-weight:600}
.auth-step-dot.done{color:var(--ok)}
.auth-step-num{width:22px;height:22px;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.auth-step-dot.active .auth-step-num{background:var(--ink);color:#fff;border-color:var(--ink)}
.auth-step-dot.done .auth-step-num{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.auth-step-line{width:24px;height:1px;background:var(--line)}
.auth-step-line.done{background:var(--ok-line)}

/* user badge chip in header */
.user-profile-btn{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 5px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;
  transition:all .18s var(--ease-spring);box-shadow:var(--shadow-xs)}
.user-profile-btn:hover{background:var(--neutral-bg);border-color:var(--faint);transform:translateY(-1px)}
.user-avatar-circle{width:24px;height:24px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
